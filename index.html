<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#0b0b0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Trainings-Tracker</title>
<style>
  :root {
    --bg: #0b0b0f;
    --surface: #17171d;
    --surface2: #1e1e26;
    --border: rgba(255,255,255,0.08);
    --text: #d4d4dc;
    --text-bright: #f2f2f7;
    --text-dim: #8e8e98;
    --gold: #c9a96e;
    --accent: #d4a95c;
    --accent2: #e08a4e;
    --green: #7fc97f;
    --red: #e06c5e;
    --blue: #6b8fad;
    --grad: linear-gradient(135deg, #d4a95c 0%, #e08a4e 100%);
    --radius: 16px;
    --shadow: 0 8px 24px rgba(0,0,0,0.45);
    --chest: #6b8fad;
    --back: #7a9a6e;
    --shoulders: #c9a96e;
    --arms: #6ea8b0;
    --legs: #8f7ab0;
    --core: #d4754e;
    --calves: #a08a6e;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { font-size: 15px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    background-image: radial-gradient(1200px 500px at 50% -10%, rgba(212,169,92,0.07), transparent 60%);
    color: var(--text);
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  /* --- HEADER --- */
  header {
    background: rgba(23,23,29,0.72);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    backdrop-filter: blur(20px) saturate(1.4);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 10px;
    position: sticky; top:0; z-index:10;
  }
  .header-top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .header-top h1 {
    font-size: 1.15rem; font-weight: 700;
    color: var(--text-bright); letter-spacing: 0.01em;
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header-top .sub { font-size: 0.72rem; color: var(--text-dim); margin-top: 2px; }
  .today-line {
    margin-top: 8px;
    font-size: 0.78rem; color: var(--text-dim);
    display:flex; align-items:center; gap:8px;
  }
  .today-line strong { color: var(--text-bright); font-weight:600; }
  .today-line .done-count { color: var(--green); font-weight:600; }

  /* --- PROGRESS RING --- */
  .ring-wrap { position:relative; width:44px; height:44px; flex:0 0 auto; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-bg { fill:none; stroke: rgba(255,255,255,0.1); stroke-width:3.5; }
  .ring-fg {
    fill:none; stroke: url(#ringGrad); stroke-width:3.5; stroke-linecap:round;
    transition: stroke-dashoffset 0.5s ease;
  }
  .ring-pct {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:0.62rem; font-weight:700; color:var(--accent);
  }

  /* --- SEGMENTED NAV --- */
  nav {
    display:flex; gap:4px;
    padding:6px 10px;
    background: rgba(23,23,29,0.72);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    overflow-x:auto; position:sticky; top:84px; z-index:9;
    scrollbar-width:none;
  }
  nav::-webkit-scrollbar { display:none; }
  nav button {
    flex:0 0 auto;
    padding:8px 14px;
    background:transparent; border:none; border-radius:10px;
    color:var(--text-dim); font-size:0.78rem; font-weight:600;
    white-space:nowrap; cursor:pointer;
    transition: all 0.2s ease;
  }
  nav button:active { transform: scale(0.95); }
  nav button.active {
    background: var(--grad);
    color:#14100a;
    box-shadow: 0 4px 14px rgba(224,138,78,0.35);
  }

  /* --- MAIN --- */
  main { padding: 14px 12px 110px; }
  .day-panel { display:none; }
  .day-panel.active { display:block; animation: fadeSlide 0.25s ease; }
  @keyframes fadeSlide {
    from { opacity:0; transform: translateY(6px); }
    to { opacity:1; transform: translateY(0); }
  }

  /* --- EXERCISE CARD --- */
  .ex-card {
    position:relative;
    background: linear-gradient(180deg, #1b1b22 0%, #15151b 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px 12px 18px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, border-color 0.2s;
    overflow:hidden;
  }
  .ex-card::before {
    content:''; position:absolute; left:0; top:0; bottom:0; width:4px;
    background: var(--mcolor, var(--gold));
    opacity:0.7;
  }
  .ex-card.superset {
    border-left: 4px solid var(--accent2);
    margin-bottom: 3px;
    border-radius: var(--radius) var(--radius) 6px 6px;
  }
  .ex-card.superset + .ex-card.superset {
    border-radius: 6px 6px var(--radius) var(--radius);
    margin-bottom: 10px;
  }
  .ex-card.done { border-color: rgba(127,201,127,0.45); }
  .ex-card.done .ex-name { color: var(--green); }
  .ex-card.timer-done { animation: pulse 0.8s ease 3; border-color: var(--accent2); }
  @keyframes pulse { 0%,100% { box-shadow: var(--shadow); } 50% { box-shadow: 0 0 0 6px rgba(224,138,78,0.35); } }

  .superset-badge {
    display:inline-block;
    background: var(--accent2); color:#14100a;
    font-size:0.58rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
    padding:2px 8px; border-radius:6px; margin-bottom:6px;
  }
  .superset-badge + .superset-badge { margin-left:4px; }
  .superset-hint { font-size:0.64rem; color:var(--accent2); margin-top:2px; font-style:italic; }

  .ex-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; gap:8px; }
  .ex-name { font-weight:600; font-size:0.88rem; color:var(--text-bright); line-height:1.3; }
  .ex-meta { font-size:0.68rem; color:var(--text-dim); white-space:nowrap; text-align:right; line-height:1.5; }
  .ex-meta .rir { color:var(--blue); font-weight:500; }
  .ex-actions { display:flex; align-items:center; gap:6px; margin-left:auto; }
  .check-btn {
    width:28px; height:28px; border-radius:50%;
    border:1.5px solid var(--border); background:transparent;
    color:transparent; font-size:0.8rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: all 0.2s;
  }
  .ex-card.done .check-btn { background: var(--green); border-color: var(--green); color:#0b0b0f; }
  .timer-btn {
    width:28px; height:28px; border-radius:9px;
    border:1px solid var(--border); background:var(--surface2);
    color:var(--gold); font-size:0.8rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: all 0.2s;
  }
  .timer-btn.running { background: var(--grad); color:#14100a; border-color:transparent; }

  .ex-note { font-size:0.66rem; color:var(--gold); margin-bottom:6px; font-style:italic; }

  /* --- LAST TRAINING / DELTA --- */
  .last-sets {
    font-size:0.7rem; color:var(--text-dim);
    margin:2px 0 8px;
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  }
  .last-sets strong { color:var(--text-bright); font-weight:500; }
  .delta {
    display:inline-block; font-size:0.64rem; font-weight:700;
    padding:2px 8px; border-radius:8px;
  }
  .delta.up { background: rgba(127,201,127,0.16); color:var(--green); }
  .delta.down { background: rgba(224,108,94,0.16); color:var(--red); }
  .delta.same { background: rgba(142,142,152,0.14); color:var(--text-dim); }

  /* --- SETS ROW --- */
  .sets-row { display:flex; gap:6px; flex-wrap:wrap; }
  .set-input { display:flex; flex-direction:column; gap:2px; }
  .set-input label { font-size:0.58rem; color:var(--text-dim); text-align:center; text-transform:uppercase; letter-spacing:0.05em; }
  .set-fields { display:flex; gap:4px; }
  .set-fields input {
    width:56px; padding:8px 2px;
    background: var(--surface2);
    border:1px solid var(--border); border-radius:10px;
    color:var(--text-bright); font-size:0.82rem; font-weight:600; text-align:center;
    font-family:inherit; transition: border 0.15s;
  }
  .set-fields input.wide { width:64px; }
  .set-fields input:focus { outline:none; border-color:var(--accent); }
  .set-fields input.filled { border-color: rgba(127,201,127,0.55); }
  .set-fields .reps-input { color: var(--blue); }

  /* --- TIMER WIDGET --- */
  .timer-widget {
    display:flex; align-items:center; gap:6px;
    margin-top:8px; padding-top:8px;
    border-top:1px dashed var(--border);
  }
  .timer-opts { display:flex; gap:3px; }
  .timer-opts button {
    padding:4px 8px; font-size:0.62rem; font-weight:600;
    background:var(--surface2); color:var(--text-dim);
    border:1px solid var(--border); border-radius:7px; cursor:pointer;
    transition: all 0.15s;
  }
  .timer-opts button.active { background:var(--grad); color:#14100a; border-color:transparent; }
  .timer-run {
    margin-left:auto; font-size:0.78rem; font-weight:700; color:var(--gold);
    font-variant-numeric: tabular-nums; min-width:52px; text-align:right;
  }
  .timer-run.finish { color: var(--green); animation: blink 0.6s ease infinite; }
  @keyframes blink { 50% { opacity:0.25; } }

  /* --- BUTTONS --- */
  .btn-row { display:flex; gap:8px; margin-top:18px; }
  .btn {
    padding:11px 16px; border:1px solid var(--border); border-radius:12px;
    background:var(--surface2); color:var(--text);
    font-size:0.8rem; font-weight:600; cursor:pointer;
    transition: all 0.15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--grad); color:#14100a; border-color:transparent; font-weight:700; box-shadow: 0 6px 18px rgba(224,138,78,0.3); }
  .btn.danger { color:var(--red); border-color: rgba(224,108,94,0.4); }
  .btn.small { padding:7px 12px; font-size:0.7rem; border-radius:9px; }

  /* --- DATE --- */
  .date-row {
    display:flex; align-items:center; gap:8px;
    margin-bottom:14px; font-size:0.8rem;
  }
  .date-row span { color:var(--text-dim); }
  .date-row strong { color:var(--text-bright); }

  /* --- LEGEND --- */
  .legend {
    margin-top:20px; padding:10px 14px;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    font-size:0.68rem; color:var(--text-dim); line-height:1.9;
  }
  .legend span { margin-right:12px; }
  .legend .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; vertical-align:middle; }
  .legend .dot.g { background:var(--green); }
  .legend .dot.o { background:var(--accent2); }
  .legend .dot.b { background:var(--blue); }
  .legend .ss-symbol {
    display:inline-block; width:10px; height:14px;
    border-left:3px solid var(--accent2); border-radius:2px;
    margin-right:4px; vertical-align:middle;
  }

  /* --- INFO TAB --- */
  .info-card {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
    box-shadow: var(--shadow);
  }
  .info-card h2 { font-size:0.82rem; font-weight:700; color:var(--accent); margin-bottom:10px; letter-spacing:0.02em; }
  .week-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; font-size:0.7rem; }
  .week-grid div { background:var(--surface2); padding:8px 2px; border-radius:9px; line-height:1.5; }
  .week-grid div strong { color:var(--text-bright); font-size:0.68rem; }
  .week-grid div.rest { opacity:0.45; }
  .rules-list { padding-left:20px; font-size:0.76rem; line-height:1.9; }
  .rules-list li strong { color:var(--text-bright); }
  .info-table { width:100%; border-collapse:collapse; font-size:0.72rem; }
  .info-table th { text-align:left; color:var(--text-dim); font-weight:500; padding:6px 10px 6px 0; border-bottom:1px solid var(--border); font-size:0.66rem; text-transform:uppercase; letter-spacing:0.04em; }
  .info-table td { padding:7px 10px 7px 0; border-bottom:1px solid var(--border); color:var(--text); }
  .info-table tr:last-child td { border-bottom:none; }
  .hand-rule { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .hand-rule div { background:var(--surface2); padding:10px 12px; border-radius:10px; font-size:0.74rem; color:var(--text-bright); line-height:1.5; }
  .hand-rule small { display:block; color:var(--text-dim); font-size:0.64rem; margin-top:2px; }
  .hand-icon { display:inline-block; background:var(--grad); color:#14100a; width:22px; height:22px; border-radius:50%; text-align:center; line-height:22px; font-weight:700; font-size:0.72rem; margin-right:6px; }
  .tempo-desc { font-size:0.76rem; color:var(--text-bright); line-height:1.6; }
  .tempo-hint { font-size:0.68rem; color:var(--accent); margin-top:4px; font-style:italic; }
  .backup-area {
    width:100%; min-height:60px;
    background:var(--surface2); border:1px solid var(--border); border-radius:10px;
    color:var(--text); font-size:0.66rem;
    font-family:ui-monospace, Menlo, monospace; padding:8px; margin-top:8px; resize:vertical;
  }

  /* --- VERLAUF TAB --- */
  .ex-chips { display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; scrollbar-width:none; }
  .ex-chips::-webkit-scrollbar { display:none; }
  .ex-chips button {
    flex:0 0 auto; padding:7px 12px; font-size:0.7rem; font-weight:600;
    background:var(--surface2); color:var(--text-dim);
    border:1px solid var(--border); border-radius:10px; cursor:pointer;
    transition: all 0.15s;
  }
  .ex-chips button.active { background:var(--grad); color:#14100a; border-color:transparent; }
  .chart-wrap {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:14px; margin-top:10px;
    box-shadow: var(--shadow);
  }
  .chart-wrap h3 { font-size:0.78rem; color:var(--text-bright); font-weight:600; margin-bottom:2px; }
  .chart-wrap .chart-sub { font-size:0.66rem; color:var(--text-dim); margin-bottom:10px; }
  .chart-wrap canvas { width:100%; height:200px; display:block; }
  .chart-empty { text-align:center; color:var(--text-dim); font-size:0.76rem; padding:30px 0; }
  .hist-list { margin-top:10px; }
  .hist-row {
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 10px; background:var(--surface2);
    border-radius:10px; margin-bottom:6px; font-size:0.74rem;
  }
  .hist-row .h-date { color:var(--text-dim); }
  .hist-row .h-val { color:var(--text-bright); font-weight:600; font-variant-numeric: tabular-nums; }
  .hist-row .h-delta { font-size:0.66rem; font-weight:700; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <h1>Trainings-Tracker</h1>
      <div class="sub">4+1 Upper/Lower · Offline-App</div>
    </div>
    <div class="ring-wrap">
      <svg width="44" height="44" viewBox="0 0 36 36">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#d4a95c"/>
            <stop offset="100%" stop-color="#e08a4e"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="18" cy="18" r="15.5"/>
        <circle class="ring-fg" id="ring-fg" cx="18" cy="18" r="15.5" stroke-dasharray="97.4" stroke-dashoffset="97.4"/>
      </svg>
      <div class="ring-pct" id="ring-pct">0%</div>
    </div>
  </div>
  <div class="today-line" id="today-line">—</div>
</header>

<nav>
  <button class="active" data-day="upper-a">Upper A</button>
  <button data-day="lower-a">Lower A</button>
  <button data-day="upper-b">Upper B</button>
  <button data-day="lower-b">Lower B</button>
  <button data-day="schwach">Schwachstellen</button>
  <button data-day="verlauf">Verlauf</button>
  <button data-day="info">Info</button>
</nav>

<main id="main"></main>

<script>
const MUSCLE_LABEL = {
  chest: 'Brust', back: 'Rücken', shoulders: 'Schultern',
  arms: 'Arme', legs: 'Beine', core: 'Core', calves: 'Waden'
};

const DAYS = {
  'upper-a': {
    title: 'Upper A — Brust + Schultern, schwer',
    exercises: [
      { id:'ua-machine-chest', name:'Maschinen-Brustpresse', sets:3, reps:'6-8', rir:'1-2', muscle:'chest', note:'Maschine gleicht langen Hebelarm aus' },
      { id:'ua-incline-smith', name:'Schrägbank-Brustpresse (Scheiben)', sets:3, reps:'8-10', rir:'1-2', muscle:'chest', note:'Maschine gleicht langen Hebelarm aus. Brust isoliert.' },
      { id:'ua-cable-flys', name:'Kabel-Flys (hoch)', sets:3, reps:'12-15', rir:'0', muscle:'chest', ssGroup:1, note:'Reine Isolation, null Hebelarm-Nachteil' },
      { id:'ua-db-shoulder', name:'Schulterdrücken sitzend (KH)', sets:3, reps:'8-10', rir:'1-2', muscle:'shoulders', ssGroup:1, note:'Kurzhanteln = natuerlichere Schulterbahn' },
      { id:'ua-lateral', name:'Seitheben (KH)', sets:4, reps:'12-15', rir:'0', muscle:'shoulders', note:'NICHT VERHANDELBAR. 4 Saetze, kurze Pause.' },
      { id:'ua-triceps-rope', name:'Trizeps-Drücken (Seil)', sets:3, reps:'10-12', rir:'1', muscle:'arms' },
      { id:'ua-face-pulls', name:'Gesichtszug (Face Pulls)', sets:3, reps:'15-20', rir:'0', muscle:'shoulders' }
    ]
  },
  'lower-a': {
    title: 'Lower A — Quad + Knie-Reha',
    exercises: [
      { id:'la-bulgarian', name:'Bulgarische Split-Squats', sets:3, reps:'8-10', rir:'2', muscle:'legs', note:'RECHTS ZUERST. Schwaecheres Bein diktiert Wdh.' },
      { id:'la-legpress', name:'Beinpresse (einseitig)', sets:3, reps:'10-12', rir:'1', muscle:'legs', note:'Jedes Bein einzeln. Defizit-Seite gibt Load vor.' },
      { id:'la-lunges', name:'Ausfallschritte gehen (KH)', sets:3, reps:'12 Schritte', rir:'1', muscle:'legs' },
      { id:'la-extensions', name:'Beinstrecker (Maschine)', sets:3, reps:'12-15', rir:'0-1', muscle:'legs' },
      { id:'la-slrdl', name:'Einbeiniges Kreuzheben (KH)', sets:3, reps:'10/Seite', rir:'2', muscle:'legs', ssGroup:1, note:'Hamstrings + Sprunggelenk-Stabilitaet' },
      { id:'la-tibialis', name:'Schienbeinheben (Tibialis)', sets:3, reps:'15-20', rir:'0', muscle:'calves', ssGroup:1, note:'Schienbein — nach Sprunggelenk-Riss essenziell' }
    ]
  },
  'upper-b': {
    title: 'Upper B — Ruecken + Arme, Volumen',
    exercises: [
      { id:'ub-lat-pulldown', name:'Latzug (enger Griff)', sets:4, reps:'6-10', rir:'1-2', muscle:'back', note:'Breite. Klimmzuege erst wenn +15kg sauber.' },
      { id:'ub-tbar', name:'Schrägbank-KH-Rudern (Incline DB Row)', sets:3, reps:'8-10', rir:'1', muscle:'back' },
      { id:'ub-cable-flys-flach', name:'Kabel-Flys (flach)', sets:3, reps:'12-15', rir:'1', muscle:'chest', note:'Brust-Isolation — 2. Brust-Reiz der Woche (Upper A = schwer, hier Volumen)' },
      { id:'ub-cable-row', name:'Kabelrudern sitzend (V-Griff)', sets:3, reps:'10-12', rir:'1', muscle:'back', ssGroup:1 },
      { id:'ub-ez-curl', name:'Curls mit EZ-Stange', sets:3, reps:'8-10', rir:'1', muscle:'arms', ssGroup:1, note:'Bizeps schwer' },
      { id:'ub-incline-curl', name:'Schrägbank-Curls (KH)', sets:3, reps:'10-12', rir:'0', muscle:'arms', ssGroup:2, note:'Bizeps in Dehnung = mehr Hypertrophie-Reiz' },
      { id:'ub-overhead-tri', name:'Trizepsstrecken über Kopf (Kabel)', sets:3, reps:'10-12', rir:'0', muscle:'arms', ssGroup:2, note:'Langer Trizeps-Kopf' },
      { id:'ub-preacher', name:'Priestercurls', sets:2, reps:'12-15', rir:'0', muscle:'arms', note:'Finisher, konstante Spannung' }
    ]
  },
  'lower-b': {
    title: 'Lower B — Posterior Chain + Sprunggelenk',
    exercises: [
      { id:'lb-rdl', name:'Rumänisches Kreuzheben (Langhantel)', sets:4, reps:'8-10', rir:'1-2', muscle:'legs', note:'Huefte nach hinten, Ruecken gerade, Spannung halten' },

const STORAGE_KEY = 'training-tracker-data';

/* ---------- Datenmodell ---------- */

function normalizeEntry(v) {
  // alt: '60'  →  neu: { w:'60', r:'' }
  if (v && typeof v === 'object') {
    return { w: String(v.w ?? ''), r: String(v.r ?? '') };
  }
  return { w: String(v ?? ''), r: '' };
}

function loadData() {
  let data = {};
  try { data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (e) { data = {}; }
  // Migration: alte String-Werte → {w,r}
  let changed = false;
  Object.keys(data).forEach(k => {
    if (k === '__dates__' || k === '__history__' || k === '__done__') return;
    if (data[k] && typeof data[k] === 'object') {
      Object.keys(data[k]).forEach(s => {
        const n = normalizeEntry(data[k][s]);
        if (n.w !== data[k][s] || (typeof data[k][s] === 'object' && data[k][s].r !== n.r)) changed = true;
        data[k][s] = n;
      });
    }
  });
  const hist = getHistory(data);
  hist.forEach(h => {
    if (!h.entries) return;
    Object.keys(h.entries).forEach(exId => {
      Object.keys(h.entries[exId] || {}).forEach(s => {
        const n = normalizeEntry(h.entries[exId][s]);
        if (n.w !== h.entries[exId][s] || n.r !== (h.entries[exId][s] && h.entries[exId][s].r)) changed = true;
        h.entries[exId][s] = n;
      });
    });
  });
  if (changed) saveData(data);
  return data;
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function getHistory(data) {
  if (!data.__history__) data.__history__ = [];
  return data.__history__;
}

function entriesEqual(a, b) {
  if (!a || !b) return false;
  const ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  return ka.every(k => {
    const na = normalizeEntry(a[k]), nb = normalizeEntry(b[k]);
    return na.w === nb.w && na.r === nb.r;
  });
}

function formatDate(iso) {
  if (!iso) return '';
  const p = iso.split('-');
  return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : iso;
}

function maxWeight(entry) {
  let max = null;
  Object.values(entry || {}).forEach(v => {
    const n = parseFloat(String(normalizeEntry(v).w).replace(',', '.'));
    if (!isNaN(n) && (max === null || n > max)) max = n;
  });
  return max;
}

function fmtKg(n) {
  return String(n).replace('.', ',');
}

function getLastEntry(data, exId) {
  const hist = getHistory(data);
  for (let i = hist.length - 1; i >= 0; i--) {
    const w = hist[i].entries && hist[i].entries[exId];
    if (w && Object.keys(w).length) return { date: hist[i].date, weights: w };
  }
  return null;
}

function getPrevEntry(data, exId, currentWeights) {
  const hist = getHistory(data);
  for (let i = hist.length - 1; i >= 0; i--) {
    const w = hist[i].entries && hist[i].entries[exId];
    if (w && Object.keys(w).length && !entriesEqual(w, currentWeights)) return { date: hist[i].date, weights: w };
  }
  return null;
}

function lastDatesForDay(data, dayKey, n) {
  return getHistory(data).filter(h => h.day === dayKey).slice(-n).map(h => h.date);
}

function migrateData(data) {
  const hist = getHistory(data);
  if (hist.length) return;
  const entries = {};
  let hasAny = false;
  Object.keys(data).forEach(k => {
    if (k === '__dates__' || k === '__history__' || k === '__done__') return;
    if (data[k] && typeof data[k] === 'object' && Object.keys(data[k]).length) {
      entries[k] = data[k];
      hasAny = true;
    }
  });
  if (hasAny) {
    hist.push({ date: new Date().toISOString().slice(0, 10), day: 'migration', entries });
  }
}

function getExEntry(data, exId) {
  return (data[exId] && typeof data[exId] === 'object') ? data[exId] : {};
}

/* ---------- Delta (Live) ---------- */

window.__prevMax = {};
window.__prevMaxDate = {};

function updateDelta(exId) {
  const el = document.getElementById('last-' + exId);
  if (!el || !window.__prevMax[exId]) return;
  const panel = el.closest('.day-panel');
  let curMax = null;
  panel.querySelectorAll('.weight-input[data-ex="' + exId + '"]').forEach(inp => {
    const n = parseFloat(inp.value.replace(',', '.'));
    if (!isNaN(n) && (curMax === null || n > curMax)) curMax = n;
  });
  const badge = el.querySelector('.delta');
  if (!badge) return;
  if (curMax === null) { badge.className = 'delta'; badge.textContent = ''; return; }
  const diff = curMax - window.__prevMax[exId];
  const d = window.__prevMaxDate[exId] ? ' ggü. ' + window.__prevMaxDate[exId] : '';
  if (diff > 0.001) { badge.className = 'delta up'; badge.textContent = '↑ +' + fmtKg(diff) + ' kg' + d; }
  else if (diff < -0.001) { badge.className = 'delta down'; badge.textContent = '↓ ' + fmtKg(diff) + ' kg' + d; }
  else { badge.className = 'delta same'; badge.textContent = '= gleich' + d; }
}

/* ---------- Timer ---------- */

window.__timers = {};
let __audioCtx = null;

function beep() {
  try {
    if (!__audioCtx) __audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = __audioCtx.createOscillator();
    const g = __audioCtx.createGain();
    o.connect(g); g.connect(__audioCtx.destination);
    o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); o.stop(__audioCtx.currentTime + 0.35);
  } catch (e) {}
}

function startTimer(exId, secs, btn) {
  if (window.__timers[exId]) stopTimer(exId);
  const runEl = document.getElementById('timer-run-' + exId);
  const card = document.getElementById('card-' + exId);
  if (!runEl || !card) return;
  let left = secs;
  runEl.textContent = fmtTime(left);
  runEl.classList.remove('finish');
  btn.classList.add('running');
  window.__timers[exId] = setInterval(function() {
    left--;
    if (left <= 0) {
      stopTimer(exId);
      runEl.textContent = 'Fertig ✓';
      runEl.classList.add('finish');
      card.classList.add('timer-done');
      beep();
      setTimeout(function() { card.classList.remove('timer-done'); }, 2600);
      return;
    }
    runEl.textContent = fmtTime(left);
  }, 1000);
}

function stopTimer(exId) {
  if (window.__timers[exId]) { clearInterval(window.__timers[exId]); delete window.__timers[exId]; }
  const runEl = document.getElementById('timer-run-' + exId);
  if (runEl) { runEl.textContent = ''; runEl.classList.remove('finish'); }
  document.querySelectorAll('.timer-btn[data-ex="' + exId + '"]').forEach(b => b.classList.remove('running'));
}

function fmtTime(s) {
  const m = Math.floor(s / 60), r = s % 60;
  return m + ':' + (r < 10 ? '0' : '') + r;
}

/* ---------- Auto-Save ---------- */

let __saveTimer = null;

function autoSave() {
  clearTimeout(__saveTimer);
  __saveTimer = setTimeout(saveCurrentState, 500);
}

function saveCurrentState() {
  const data = loadData();
  document.querySelectorAll('.weight-input, .reps-input').forEach(inp => {
    const exId = inp.dataset.ex, setId = inp.dataset.set;
    if (!data[exId]) data[exId] = {};
    if (!data[exId][setId]) data[exId][setId] = {};
    if (inp.classList.contains('weight-input')) data[exId][setId].w = inp.value.trim();
    else data[exId][setId].r = inp.value.trim();
  });
  saveData(data);
  updateProgress();
}

/* ---------- Abhaken / Fortschritt ---------- */

function isExDone(data, exId) {
  const done = data.__done__ || {};
  if (done[exId]) return true;
  const ex = getExEntry(data, exId);
  const vals = Object.keys(ex).map(k => normalizeEntry(ex[k]).w).filter(Boolean);
  return vals.length > 0;
}

function toggleDone(exId) {
  const data = loadData();
  if (!data.__done__) data.__done__ = {};
  data.__done__[exId] = !data.__done__[exId];
  saveData(data);
  const card = document.getElementById('card-' + exId);
  if (card) card.classList.toggle('done', data.__done__[exId]);
  updateProgress();
}

function updateProgress() {
  const data = loadData();
  const activeDay = document.querySelector('nav button.active').dataset.day;
  const day = DAYS[activeDay];
  const todayLine = document.getElementById('today-line');
  const ringFg = document.getElementById('ring-fg');
  const ringPct = document.getElementById('ring-pct');
  if (!day || day.content) {
    todayLine.textContent = '—';
    if (ringFg) ringFg.style.strokeDashoffset = '97.4';
    if (ringPct) ringPct.textContent = '0%';
    return;
  }
  const total = day.exercises.length;
  const doneCount = day.exercises.filter(ex => isExDone(data, ex.id)).length;
  const pct = total ? Math.round(doneCount / total * 100) : 0;
  const C = 97.4;
  if (ringFg) ringFg.style.strokeDashoffset = String(C * (1 - pct / 100));
  if (ringPct) ringPct.textContent = pct + '%';
  if (todayLine) {
    const lastDates = lastDatesForDay(data, activeDay, 1);
    const lastTxt = lastDates.length ? ' · Letztes Mal ' + formatDate(lastDates[0]) : '';
    todayLine.innerHTML = 'Heute: <strong>' + day.title.split(' — ')[0] + '</strong>' + lastTxt +
      ' · <span class="done-count">' + doneCount + '/' + total + ' Übungen</span>';
  }
}

/* ---------- Render ---------- */

function renderDay(dayKey) {
  const day = DAYS[dayKey];

  if (day.content) {
    if (dayKey === 'verlauf') return renderVerlauf();
    return renderInfo();
  }

  const data = loadData();
  const dayData = data.__dates__ || {};
  const lastDate = dayData[dayKey] || null;
  const lastDates = lastDatesForDay(data, dayKey, 3).map(formatDate);
  const dateInfo = lastDates.length ? lastDates.join(' · ') : (lastDate ? formatDate(lastDate) : 'noch nie');
  const done = data.__done__ || {};

  let html = '<div class="day-panel active" id="panel-' + dayKey + '">';
  html += '<div class="date-row"><span>Letzte Trainings:</span> <strong>' + dateInfo + '</strong></div>';

  let prevSsGroup = 0;
  day.exercises.forEach(ex => {
    const isSuperset = ex.ssGroup > 0;
    const cardClass = 'ex-card' + (isSuperset ? ' superset' : '') + (done[ex.id] ? ' done' : '');
    const mcolor = '--mcolor: var(--' + (ex.muscle || 'gold') + ');';
    let ssBadge = '', ssHint = '';
    if (isSuperset) {
      ssBadge = '<div class="superset-badge">↔ Supersatz ' + ex.ssGroup + '</div>';
      if (prevSsGroup === ex.ssGroup) {
        ssHint = '<div class="superset-hint">Im Wechsel mit der Übung darüber ausführen</div>';
      }
      prevSsGroup = ex.ssGroup;
    } else {
      prevSsGroup = 0;
    }

    const cur = getExEntry(data, ex.id);
    const lastE = getLastEntry(data, ex.id);
    const prevE = getPrevEntry(data, ex.id, cur);
    let lastLine = '';
    if (lastE) {
      const wStr = Object.values(lastE.weights)
        .map(v => { const n = normalizeEntry(v); return n.w ? (n.r ? n.w + '×' + n.r : n.w) : ''; })
        .filter(Boolean).join(' · ');
      if (wStr) {
        const base = prevE || lastE;
        const baseMax = maxWeight(base.weights);
        const baseDate = formatDate(base.date);
        const curMax = maxWeight(cur);
        let txt = '', cls = 'same';
        if (baseMax !== null && curMax !== null) {
          const diff = curMax - baseMax;
          if (diff > 0.001) { txt = '↑ +' + fmtKg(diff) + ' kg ggü. ' + baseDate; cls = 'up'; }
          else if (diff < -0.001) { txt = '↓ ' + fmtKg(diff) + ' kg ggü. ' + baseDate; cls = 'down'; }
          else { txt = '= gleich ggü. ' + baseDate; cls = 'same'; }
        }
        if (!prevE) txt = '';
        window.__prevMax[ex.id] = baseMax;
        window.__prevMaxDate[ex.id] = baseDate;
        lastLine = '<div class="last-sets" id="last-' + ex.id + '">Letztes Mal (' + formatDate(lastE.date) + '): <strong>' + wStr + ' kg</strong> <span class="delta ' + cls + '">' + txt + '</span></div>';
      }
    }

    html += '<div class="' + cardClass + '" id="card-' + ex.id + '" style="' + mcolor + '">';
    if (ssBadge) html += ssBadge;
    html += '<div class="ex-header">';
    html += '<div class="ex-name">' + ex.name + '</div>';
    html += '<div class="ex-actions">';
    html += '<button class="timer-btn" data-ex="' + ex.id + '" onclick="toggleTimer(\'' + ex.id + '\')" title="Pausentimer">⏱</button>';
    html += '<button class="check-btn" onclick="toggleDone(\'' + ex.id + '\')" title="Übung abhaken">✓</button>';
    html += '</div>';
    html += '<div class="ex-meta">' + ex.sets + ' × ' + ex.reps + '<br><span class="rir">RIR ' + ex.rir + '</span></div>';
    html += '</div>';
    if (ex.note) html += '<div class="ex-note">' + ex.note + '</div>';
    if (lastLine) html += lastLine;

    html += '<div class="sets-row">';
    for (let s = 1; s <= ex.sets; s++) {
      const val = normalizeEntry(getExEntry(data, ex.id)[s]);
      const wFilled = val.w ? ' filled' : '';
      const rFilled = val.r ? ' filled' : '';
      html += '<div class="set-input">';
      html += '<label>' + s + '. Satz</label>';
      html += '<div class="set-fields">';
      html += '<input type="text" inputmode="decimal" class="weight-input' + wFilled + '" data-ex="' + ex.id + '" data-set="' + s + '" placeholder="kg" value="' + val.w + '">';
      html += '<input type="text" inputmode="numeric" class="reps-input' + rFilled + '" data-ex="' + ex.id + '" data-set="' + s + '" placeholder="Wdh" value="' + val.r + '">';
      html += '</div>';
      html += '</div>';
    }
    html += '</div>';

    html += '<div class="timer-widget">';
    html += '<div class="timer-opts">';
    [60, 90, 120, 180].forEach(secs => {
      html += '<button onclick="setTimerOpt(\'' + ex.id + '\', ' + secs + ', this)">' + secs + 's</button>';
    });
    html += '</div>';
    html += '<div class="timer-run" id="timer-run-' + ex.id + '"></div>';
    html += '</div>';

    if (ssHint) html += ssHint;
    html += '</div>';
  });

  html += '<div class="btn-row">';
  html += '<button class="btn primary" onclick="saveCurrentDay(\'' + dayKey + '\')">Training speichern</button>';
  html += '<button class="btn" onclick="clearCurrentDay(\'' + dayKey + '\')">Leeren</button>';
  html += '<button class="btn danger" onclick="resetAll()">Alles löschen</button>';
  html += '</div>';
  html += '<p style="font-size:0.62rem;color:var(--text-dim);margin-top:8px;text-align:center;">Eingaben werden automatisch gespeichert · „Training speichern" legt den Verlaufs-Eintrag an</p>';

  html += '<div class="legend">';
  html += '<span><span class="dot g"></span> grün = gespeichert / abgehakt</span>';
  html += '<span><span class="dot o"></span> ⏱ = Pausentimer</span><br>';
  html += '<span><span class="dot b"></span> RIR = Reps in Reserve</span>';
  html += '<span><span class="ss-symbol">↔</span> orange = Supersatz (gleiche Nummer = Paar)</span>';
  html += '</div>';
  html += '</div>';
  return html;
}

/* ---------- Timer-Interaktion ---------- */

window.__timerOpts = {};

function setTimerOpt(exId, secs, btn) {
  window.__timerOpts[exId] = secs;
  btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function toggleTimer(exId) {
  if (window.__timers[exId]) { stopTimer(exId); return; }
  const secs = window.__timerOpts[exId] || 90;
  const btn = document.querySelector('.timer-btn[data-ex="' + exId + '"]');
  startTimer(exId, secs, btn);
}

    '<textarea class="backup-area" id="backup-area" placeholder="Backup erscheint hier nach Klick auf \'Sichern\'. Zum Wiederherstellen: Backup-Text einfügen, dann \'Wiederherstellen\'."></textarea>' +
    '</div></div>';
}

/* ---------- Verlauf-Tab ---------- */

let __verlaufEx = null;

function allExercises() {
  const list = [];
  Object.keys(DAYS).forEach(k => {
    const d = DAYS[k];
    if (d.exercises) d.exercises.forEach(ex => list.push(ex));
  });
  return list;
}

function renderVerlauf() {
  const exs = allExercises();
  if (!__verlaufEx) __verlaufEx = exs.length ? exs[0].id : null;
  const data = loadData();

  let html = '<div class="day-panel active" id="panel-verlauf">';
  html += '<div class="info-card"><h2>Gewichts-Verlauf</h2>';
  html += '<div class="ex-chips">';
  exs.forEach(ex => {
    html += '<button class="' + (ex.id === __verlaufEx ? 'active' : '') + '" onclick="selectVerlaufEx(\'' + ex.id + '\')">' + ex.name.split(' (')[0] + '</button>';
  });
  html += '</div></div>';

  const hist = getHistory(data);
  const points = [];
  hist.forEach(h => {
    const w = h.entries && h.entries[__verlaufEx];
    const m = maxWeight(w);
    if (m !== null) points.push({ date: h.date, kg: m });
  });
  points.sort((a, b) => a.date < b.date ? -1 : 1);

  html += '<div class="chart-wrap"><h3>' + (__verlaufEx ? __verlaufEx.split('-').pop() : '') + '</h3>';
  if (points.length >= 2) {
    html += '<div class="chart-sub">Bestes Gewicht pro Training · ' + points.length + ' Einträge</div>';
    html += '<canvas id="verlauf-canvas"></canvas>';
  } else if (points.length === 1) {
    html += '<div class="chart-sub">Bisher 1 Training · ' + fmtKg(points[0].kg) + ' kg (' + formatDate(points[0].date) + ')</div>';
    html += '<div class="chart-empty">Ab dem 2. Training erscheint hier die Steigerungs-Kurve 📈</div>';
  } else {
    html += '<div class="chart-empty">Noch kein Training für diese Übung gespeichert</div>';
  }

  html += '<div class="hist-list">';
  for (let i = points.length - 1; i >= 0; i--) {
    let delta = '';
    if (i < points.length - 1) {
      const diff = points[i].kg - points[i + 1].kg;
      if (diff > 0.001) delta = '<span class="h-delta" style="color:var(--green)">↑ +' + fmtKg(diff) + ' kg</span>';
      else if (diff < -0.001) delta = '<span class="h-delta" style="color:var(--red)">↓ ' + fmtKg(diff) + ' kg</span>';
      else delta = '<span class="h-delta" style="color:var(--text-dim)">= gleich</span>';
    }
    html += '<div class="hist-row"><span class="h-date">' + formatDate(points[i].date) + '</span><span class="h-val">' + fmtKg(points[i].kg) + ' kg</span>' + delta + '</div>';
  }
  html += '</div></div></div>';
  return html;
}

function selectVerlaufEx(exId) {
  __verlaufEx = exId;
  renderAll();
}

function drawVerlaufChart() {
  const canvas = document.getElementById('verlauf-canvas');
  if (!canvas) return;
  const data = loadData();
  const hist = getHistory(data);
  const points = [];
  hist.forEach(h => {
    const w = h.entries && h.entries[__verlaufEx];
    const m = maxWeight(w);
    if (m !== null) points.push({ date: h.date, kg: m });
  });
  points.sort((a, b) => a.date < b.date ? -1 : 1);
  if (points.length < 2) return;

  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const W = rect.width, H = rect.height;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const padL = 34, padR = 12, padT = 12, padB = 22;
  const iw = W - padL - padR, ih = H - padT - padB;
  let min = Infinity, max = -Infinity;
  points.forEach(p => { if (p.kg < min) min = p.kg; if (p.kg > max) max = p.kg; });
  if (min === max) { min -= 1; max += 1; }
  const pad = (max - min) * 0.15;
  min -= pad; max += pad;

  const x = i => padL + (points.length > 1 ? i / (points.length - 1) * iw : iw / 2);
  const y = kg => padT + ih - (kg - min) / (max - min) * ih;

  ctx.clearRect(0, 0, W, H);

  // Gitter + Y-Beschriftung
  ctx.font = '10px -apple-system, sans-serif';
  ctx.fillStyle = '#8e8e98';
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  const steps = 4;
  for (let i = 0; i <= steps; i++) {
    const kg = min + (max - min) * i / steps;
    const yy = y(kg);
    ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(W - padR, yy); ctx.stroke();
    ctx.fillText(fmtKg(Math.round(kg * 10) / 10), 4, yy + 3);
  }

  // X-Beschriftung (erstes + letztes Datum)
  ctx.fillText(formatDate(points[0].date), padL, H - 6);
  ctx.textAlign = 'right';
  ctx.fillText(formatDate(points[points.length - 1].date), W - padR, H - 6);
  ctx.textAlign = 'left';

  // Fläche + Linie
  ctx.beginPath();
  points.forEach((p, i) => { const px = x(i), py = y(p.kg); i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py); });
  const grad = ctx.createLinearGradient(0, padT, 0, padT + ih);
  grad.addColorStop(0, 'rgba(212,169,92,0.25)');
  grad.addColorStop(1, 'rgba(212,169,92,0)');
  ctx.lineTo(x(points.length - 1), padT + ih);
  ctx.lineTo(x(0), padT + ih);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  points.forEach((p, i) => { const px = x(i), py = y(p.kg); i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py); });
  ctx.strokeStyle = '#d4a95c';
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Punkte + kg-Labels
  points.forEach((p, i) => {
    const px = x(i), py = y(p.kg);
    ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#0b0b0f'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#e08a4e'; ctx.stroke();
    ctx.font = 'bold 10px -apple-system, sans-serif';
    ctx.fillStyle = '#f2f2f7';
    ctx.textAlign = 'center';
    ctx.fillText(fmtKg(p.kg), px, py - 9);
    ctx.textAlign = 'left';
  });
}

/* ---------- Speichern / Löschen ---------- */

function saveCurrentDay(dayKey) {
  const data = loadData();
  const today = new Date().toISOString().slice(0, 10);
  if (!data.__dates__) data.__dates__ = {};
  data.__dates__[dayKey] = today;

  const panel = document.getElementById('panel-' + dayKey);
  if (!panel) return;
  const entries = {};
  panel.querySelectorAll('.weight-input, .reps-input').forEach(inp => {
    const exId = inp.dataset.ex, setId = inp.dataset.set;
    if (!data[exId]) data[exId] = {};
    if (!data[exId][setId]) data[exId][setId] = {};
    if (!entries[exId]) entries[exId] = {};
    if (!entries[exId][setId]) entries[exId][setId] = {};
    if (inp.classList.contains('weight-input')) {
      data[exId][setId].w = inp.value.trim();
      entries[exId][setId].w = inp.value.trim();
    } else {
      data[exId][setId].r = inp.value.trim();
      entries[exId][setId].r = inp.value.trim();
    }
  });

  const hist = getHistory(data);
  const last = hist[hist.length - 1];
  const isDup = last && last.day === dayKey && last.date === today && entriesEqual(last.entries, entries);
  if (!isDup) {
    hist.push({ date: today, day: dayKey, entries: entries });
  }
  saveData(data);
  renderAll();

  const btn = document.querySelector('#panel-' + dayKey + ' .btn.primary');
  if (btn) {
    const orig = btn.textContent;
    btn.textContent = '✓ Gespeichert!';
    btn.style.background = 'linear-gradient(135deg, #5a9a5a, #4a8a4a)';
    setTimeout(function() {
      btn.textContent = orig;
      btn.style.background = '';
    }, 1200);
  }
}

function clearCurrentDay(dayKey) {
  if (!confirm('Alle Gewichte fuer diesen Tag loeschen?')) return;
  const data = loadData();
  const day = DAYS[dayKey];
  day.exercises.forEach(ex => {
    if (data[ex.id]) delete data[ex.id];
    if (data.__done__) delete data.__done__[ex.id];
  });
  if (data.__dates__) delete data.__dates__[dayKey];
  saveData(data);
  renderAll();
}

function resetAll() {
  if (!confirm('ALLE gespeicherten Daten unwiderruflich loeschen?')) return;
  localStorage.removeItem(STORAGE_KEY);
  renderAll();
}

/* ---------- Backup ---------- */

function exportBackup() {
  const ta = document.getElementById('backup-area');
  const raw = localStorage.getItem(STORAGE_KEY) || '{}';
  ta.value = raw;
  ta.focus();
  ta.select();
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(raw).then(function() { flashBackupBtn('✓ Kopiert!'); }, function() {});
    } else {
      document.execCommand('copy');
      flashBackupBtn('✓ Kopiert!');
    }
  } catch (e) {
    flashBackupBtn('Text markiert — manuell kopieren');
  }
}

function flashBackupBtn(msg) {
  const ta = document.getElementById('backup-area');
  if (!ta) return;
  const card = ta.closest('.info-card');
  const btn = card.querySelector('.btn.primary');
  const orig = btn.textContent;
  btn.textContent = msg;
  setTimeout(function() { btn.textContent = orig; }, 1500);
}

function importBackup() {
  const ta = document.getElementById('backup-area');
  const raw = ta.value.trim();
  if (!raw) {
    alert('Kein Backup-Text im Feld. Erst ein Backup einfügen (oder vorher "Sichern" drücken).');
    return;
  }
  let parsed;
  try { parsed = JSON.parse(raw); } catch (e) { alert('Ungültiges Backup-Format.'); return; }
  if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) { alert('Ungültiges Backup-Format.'); return; }
  if (!confirm('Aktuelle Daten werden durch das Backup ERSETZT. Fortfahren?')) return;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
  renderAll();
  ta.value = '';
  alert('Backup wiederhergestellt!');
}

/* ---------- Render-All / Tabs / Events ---------- */

function renderAll() {
  const data = loadData();
  migrateData(data);
  saveData(data);
  const main = document.getElementById('main');
  main.innerHTML = '';
  Object.keys(DAYS).forEach(function(key) {
    main.innerHTML += renderDay(key);
  });
  const activeDay = document.querySelector('nav button.active').dataset.day;
  showDay(activeDay);
  attachInputListeners();
  updateProgress();
  if (activeDay === 'verlauf') {
    setTimeout(drawVerlaufChart, 50);
    window.addEventListener('resize', drawVerlaufChart);
  }
}

function showDay(dayKey) {
  document.querySelectorAll('.day-panel').forEach(function(p) { p.classList.remove('active'); });
  const panel = document.getElementById('panel-' + dayKey);
  if (panel) panel.classList.add('active');
  if (dayKey === 'verlauf') setTimeout(drawVerlaufChart, 50);
}

function attachInputListeners() {
  document.querySelectorAll('.weight-input, .reps-input').forEach(function(input) {
    input.addEventListener('input', function() {
      if (this.value) this.classList.add('filled');
      else this.classList.remove('filled');
      updateDelta(this.dataset.ex);
      autoSave();
    });
  });
}

// Tab switching
document.querySelectorAll('nav button').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('nav button').forEach(function(b) { b.classList.remove('active'); });
    this.classList.add('active');
    showDay(this.dataset.day);
    updateProgress();
  });
});

// Initial render
renderAll();

// PWA: Offline-Cache registrieren
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js').catch(function() {});
  });
}
</script>
