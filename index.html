<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Dein persönlicher Trainingsplan: flexible Viererrotation, Gewichte und Wiederholungen, Verlauf und Offline-Nutzung.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#101311">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>Training · Dein Trainings-Tracker</title>
</head>
<body>
<a class="skip-link" href="#main">Zum Inhalt</a>
<header class="app-header"><a class="brand" href="./" aria-label="Training Startseite"><span class="brand-mark" aria-hidden="true">t.</span><span>TRAINING<span class="brand-sub">Dein Fortschritt zählt.</span></span></a><div class="save-indicator" id="save-status" role="status">Auf diesem Gerät gespeichert</div></header>
<div class="app-notice" id="notice" role="status" hidden></div>
<button id="update-app" class="update-app btn" hidden>Neue Version laden · Eingaben werden vorher gesichert</button>
<main id="main" tabindex="-1"></main>
<nav class="bottom-nav" aria-label="Hauptnavigation">
<button data-page="training"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 8v8m4-11v14M8 12h8m0-7v14m4-11v8"/></svg>Training</button>
<button data-page="verlauf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 19V9m8 10V5m8 14v-7"/></svg>Verlauf</button>
<button data-page="info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 7h16M4 17h16M8 4v6m8 4v6"/></svg>Einstellungen</button>
</nav>
<div class="input-tools" id="input-tools" aria-label="Eingabefelder wechseln" hidden>
  <button type="button" data-input-action="previous">Zurück</button>
  <button type="button" data-input-action="next">Weiter</button>
  <button type="button" data-input-action="done">Fertig</button>
</div>
<script src="app.js" defer></script>
</body>
</html>
